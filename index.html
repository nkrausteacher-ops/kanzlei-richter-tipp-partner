const cases=[{id:'adler',name:'Martin Adler',job:'Lehrer',email:'martin.adler@beispiel.invalid',salary:56000,withheld:11200,commute:2400,other:850,sa:4700,donation:0,agB:0,notes:'Herr Adler bittet um Prüfung seiner Werbungskosten und eine erste Steuerberechnung.'},{id:'neumann',name:'Sarah Neumann',job:'Sachbearbeiterin',email:'sarah.neumann@beispiel.invalid',salary:36000,withheld:4800,commute:450,other:350,sa:7100,donation:0,agB:0,notes:'Frau Neumann fragt, ob sich eine Steuererklärung lohnt.'},{id:'heilmann',name:'Chris Heilmann',job:'Kfz-Mechatroniker',email:'chris.heilmann@beispiel.invalid',salary:24000,withheld:1600,commute:1650,other:480,sa:4200,donation:0,agB:0,notes:'Ausbildungsabschluss im Juni, Übernahme als Geselle im Juli.'}];
const mails=[{id:1,from:'Martin Adler',subject:'Steuererklärung 2025 – Bitte um Rückmeldung',body:'Guten Tag, ich habe verschiedene berufliche Ausgaben und möchte wissen, ob ich mit einer Steuererstattung rechnen kann. Bitte prüfen Sie meinen Fall. Freundliche Grüße, Martin Adler',caseId:'adler'},{id:2,from:'Sarah Neumann',subject:'Lohnt sich meine Steuererklärung?',body:'Guten Tag, ich hatte 2025 nur wenige zusätzliche berufliche Ausgaben. Können Sie prüfen, ob sich eine Einkommensteuererklärung lohnt? Viele Grüße, Sarah Neumann',caseId:'neumann'},{id:3,from:'Frau Hartmann · Ausbildungsleitung',subject:'Arbeitsauftrag: ESt-Veranlagung 2025',body:'Bitte bearbeiten Sie zunächst den Fall Martin Adler. Dokumentieren Sie Ihre Berechnung und formulieren Sie eine fachlich korrekte Antwort. Achtung: Unsere Simulation bildet nicht alle steuerlichen Sonderfälle ab.',caseId:'adler'}];
const defaults={};for(const c of cases)defaults[c.id]={salary:c.salary,withheld:c.withheld,commute:c.commute,other:c.other,sa:c.sa,donation:c.donation,agB:c.agB,filing:'single',manualZve:'',notes:''};let state;try{state=JSON.parse(localStorage.getItem('kanzlei2025'))||{}}catch{state={}}state.forms={...defaults,...(state.forms||{})};state.replies=state.replies||{};state.read=state.read||{};state.done=state.done||{};state.selected=state.selected||'adler';let page='home';const euro=n=>Number(n||0).toLocaleString('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0});const num=x=>Math.max(0,Number(x)||0);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem('kanzlei2025',JSON.stringify(state));function tarif(zve,split=false){let x=Math.floor(Math.max(0,zve)/(split?2:1)),t=0;if(x<=12096)t=0;else if(x<=17443){let y=(x-12096)/10000;t=(932.30*y+1400)*y}else if(x<=68480){let z=(x-17443)/10000;t=(176.64*z+2397)*z+1015.13}else if(x<=277825)t=.42*x-10911.92;else t=.45*x-19246.67;return Math.floor(Math.max(0,t)*(split?2:1))}function calc(f){let gross=num(f.salary),wk=Math.max(1230,num(f.commute)+num(f.other)),income=Math.max(0,gross-wk),sa=num(f.sa)+num(f.donation),zve=f.manualZve!==''?num(f.manualZve):Math.max(0,income-sa),tax=tarif(zve,f.filing==='split');return {gross,wk,income,sa,zve,tax,balance:num(f.withheld)-tax,manual:f.manualZve!==''}}function nav(){document.getElementById('nav').innerHTML=[['home','⌂ Übersicht'],['mail','✉ Posteingang'],['cases','▣ Mandantenakten'],['tax','▤ ESt-Rechner 2025'],['tasks','✓ Arbeitsaufträge'],['about','ⓘ Hinweise']].map(([p,t])=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${t}</button>`).join('')}function go(p){page=p;nav();render()}function selectCase(id){state.selected=id;save();go('tax')}function render(){const c=document.getElementById('content');if(page==='home')c.innerHTML=`<h1>Guten Morgen, Lisa!</h1><p class="muted">Ihr digitaler Arbeitsplatz · Steuerkanzlei Richter Tipp & Partner</p><div class="grid"><div class="stat">Neue Nachrichten<b>${mails.filter(m=>!state.read[m.id]).length}</b></div><div class="stat">Mandantenakten<b>${cases.length}</b></div><div class="stat">Offene Aufträge<b>${cases.filter(x=>!state.done[x.id]).length}</b></div></div><div class="panel" style="margin-top:18px"><span class="tag">Priorität: Heute</span><h2 style="margin-top:12px">Einkommensteuererklärung 2025 – Martin Adler</h2><p>Prüfen Sie die Mandantenunterlagen, erfassen Sie die steuerlichen Daten und erstellen Sie eine überschlägige Einkommensteuerberechnung.</p><button class="primary" onclick="selectCase('adler')">Arbeitsauftrag öffnen</button></div><div class="panel"><h2>Aktuelle Kanzleimitteilungen</h2><p>Bitte beachten Sie bei der Bearbeitung die geltenden Vorschriften für den Veranlagungszeitraum 2025.</p></div>`;
else if(page==='mail')c.innerHTML=`<h1>Posteingang</h1><p class="muted">Fiktive Kanzlei-E-Mails · Antworten bleiben lokal in diesem Browser</p><div class="panel"><table><tbody>${mails.map(m=>`<tr class="click" onclick="openMail(${m.id})"><td>${state.read[m.id]?'✉':'●'} ${esc(m.from)}</td><td>${esc(m.subject)}</td><td>${state.replies[m.id]?'✓ beantwortet':'Öffnen'}</td></tr>`).join('')}</tbody></table></div><div id="maildetail"></div>`;
else if(page==='cases')c.innerHTML=`<h1>Mandantenakten</h1><p class="muted">Alle Angaben sind fiktive Unterrichtsdaten.</p>${cases.map(m=>`<div class="panel"><span class="tag">Mandant ${esc(m.id.toUpperCase())}</span><h2 style="margin-top:12px">${esc(m.name)}</h2><p>${esc(m.job)} · ${esc(m.email)}</p><p>${esc(m.notes)}</p><button class="primary" onclick="selectCase('${m.id}')">Akte öffnen und berechnen</button></div>`).join('')}`;
else if(page==='tax')taxPage(c);else if(page==='tasks')c.innerHTML=`<h1>Arbeitsaufträge</h1><p class="muted">Bearbeitungsstand Ihrer Mandantenfälle</p>${cases.map(m=>`<div class="panel"><h2>${esc(m.name)}</h2><p>${esc(m.notes)}</p><p>${state.done[m.id]?'<span class="good">✓ Als erledigt markiert</span>':'<span class="muted">○ Noch offen</span>'}</p><button class="secondary" onclick="selectCase('${m.id}')">Bearbeiten</button> <button class="secondary" onclick="state.done['${m.id}']=!state.done['${m.id}'];save();render()">Status ändern</button></div>`).join('')}`;
else c.innerHTML=`<h1>Wichtige Hinweise</h1><div class="panel"><h2>Umfang der Simulation</h2><p>Die Website bildet einen vereinfachten Einkommensteuerfall für Arbeitnehmerinnen und Arbeitnehmer ab. Der <strong>Grundtarif und Splittingtarif 2025 nach § 32a EStG</strong> sind implementiert. Der Steuerrechner ermittelt aus eingegebenen Werten einen vereinfachten Weg zum zu versteuernden Einkommen.</p><p><strong>Nicht automatisch berücksichtigt</strong> werden u. a. Vorsorgeaufwendungen im Detail, Arbeitnehmer-Pauschbeträge in Sonderkonstellationen, außergewöhnliche Belastungen mit zumutbarer Belastung, Kinder, Entlastungsbeträge, Progressionsvorbehalt, Steuerermäßigungen, Kirchensteuer und Solidaritätszuschlag. Die Erstattung ist deshalb lediglich eine didaktische Näherung.</p><p>Die Option „zvE direkt eingeben“ erlaubt die fachlich korrekt ermittelte Bemessungsgrundlage zu verwenden.</p><p>Alle Nachrichten und Mandanten sind fiktiv. Daten werden ausschließlich im lokalen Browser gespeichert, nicht zwischen Geräten synchronisiert. Es gibt keine echten Benutzerkonten und keinen echten E-Mail-Versand. Für den Einsatz mit Schülern bitte ausschließlich fiktive Daten verwenden.</p><p>Tarifquelle: <a href="https://esth.bundesfinanzministerium.de/esth/2025/A-Einkommensteuergesetz/IV-Tarif-31-34b/Paragraf-32a/paragraf-32a.html" target="_blank" rel="noopener">BMF – § 32a EStG 2025</a>.</p><button class="secondary no-print" onclick="if(confirm('Alle lokalen Eingaben zurücksetzen?')){localStorage.removeItem('kanzlei2025');location.reload()}">Simulation zurücksetzen</button></div>`}

 href="https://www.bmf-steuerrechner.de/interface/programmablauf.xhtml" target="_blank" rel="noopener">Andere Jahre und Programmablaufpläne ↗</a></p><div class="two"><label>Monatliche Lohnsteuer laut BMF (€)<input type="number" min="0" step="0.01" data-pay="lst" placeholder="Amtlichen Wert eintragen" value="${esc(f.lst)}"></label><label>Monatlicher Solidaritätszuschlag laut BMF (€)<input type="number" min="0" step="0.01" data-pay="soli" value="${esc(f.soli)}"></label></div><div class="notice">Der Nettolohn wird erst nach Eingabe der amtlichen Lohnsteuer berechnet. Sonderfälle wie Midijob, Minijob, private Krankenversicherung, Einmalzahlungen und Übergangsbereiche sind hier nicht abgebildet.</div></div><div class="panel"><h2>4 · Gehaltsabrechnung</h2><div id="pay-result"></div><p class="no-print"><button class="primary" onclick="window.print()">Abrechnung drucken / als PDF sichern</button></p></div><div class="panel"><h2>Quellen und Rechtsstand</h2><p class="muted">Gesetzliche Rechengrößen und Standardsätze 2025/2026. Quellen: <a href="https://www.bundesgesundheitsministerium.de/beitraege" target="_blank">BMG Krankenversicherung</a>, <a href="https://www.bundesgesundheitsministerium.de/themen/pflege/online-ratgeber-pflege/die-pflegeversicherung/finanzierung" target="_blank">BMG Pflegeversicherung</a>, <a href="https://www.bmas.bund.de/DE/Service/Gesetze-und-Gesetzesvorhaben/sozialversicherungs-rechengroessenverordnung-2026.html" target="_blank">BMAS Rechengrößen 2026</a>. Werte werden nicht automatisch aktualisiert; vor Nutzung in späteren Jahren Rechtsstand prüfen.</p></div>`;

function drawPayroll(){let f=state.payroll,r=payrollRates[f.year],gross=num(f.gross),kvBase=Math.min(gross,r.kv),rvBase=Math.min(gross,r.rv),round=x=>Math.round((x+Number.EPSILON)*100)/100;
let rv=round(rvBase*.093),av=round(rvBase*.013),kv=round(kvBase*(.073+num(f.addon)/200));let childCount=Number(f.children)||0;let pvRate=(f.state==='SN'?.023:.018)+(f.childless==='yes'?.006:0)-Math.max(0,Math.min(5,childCount)-1)*.0025;let pv=round(kvBase*pvRate);let sv=round(rv+av+kv+pv),lst=f.lst===''?null:num(f.lst),soli=num(f.soli);if(f.estimate){let annual=gross*12,allowance=(f.taxClass==='6'?0:1230),deductions=(rv+kv+pv+av)*12;let taxable=Math.max(0,annual-allowance-deductions-36);let split=f.taxClass==='3';let baseTax=tarif(taxable,split);if(f.taxClass==='2')baseTax=tarif(Math.max(0,taxable-4260));if(f.taxClass==='5'||f.taxClass==='6')baseTax=tarif(taxable+Math.max(0,annual*.15));lst=round(baseTax/12);soli=0;}let church=f.church==='yes'&&lst!==null?round(lst*(f.state==='BY'?.08:.09)):0,net=lst===null?null:round(gross-sv-lst-soli-church);

const detailLabels={workdays:'Arbeitstage (erste Tätigkeitsstätte)',distance:'Einfache Entfernung (km)',homeDays:'Homeoffice-Tage',equipment:'Arbeitsmittel (€)',training:'Fortbildungskosten (€)',travel:'Dienstreisen / VMA (€)',union:'Gewerkschaft / Berufsverband (€)',otherWK:'Weitere Werbungskosten (€)',wageReplacement:'Lohnersatzleistungen (€)',pension:'Abziehbare Altersvorsorgebeiträge (€)',health:'Abziehbare Basis-Krankenversicherung (€)',care:'Pflegepflichtversicherung (€)',unemployment:'Arbeitslosenversicherung (€)',otherInsurance:'Sonstige Versicherungen (€)',donations:'Spenden (€)',churchPaid:'Gezahlte Kirchensteuer (€)',otherSA:'Weitere Sonderausgaben (€)',medical:'Krankheitskosten / agB (€)',reasonable:'Zumutbare Belastung (€) – selbst ermitteln',taxCredit:'Steuerermäßigungen nach §§ 35a, 35c EStG (€)',withheldSoli:'Einbehaltener Solidaritätszuschlag (€)'};
function detailForm(){let id=state.selected,f=state.forms[id];if(!f.detail){f.detail={workdays:'',distance:'',homeDays:'',equipment:'',training:'',travel:'',union:'',otherWK:String(f.other||0),wageReplacement:'',pension:'',health:'',care:'',unemployment:'',otherInsurance:'',donations:String(f.donation||0),churchPaid:'',otherSA:String(f.sa||0),medical:'',reasonable:'',taxCredit:'',withheldSoli:''};save()}return f.detail}
function field(key,tip=''){let d=detailForm(),isCount=['workdays','distance','homeDays'].includes(key);return `<label>${detailLabels[key]}${tip?`<small style="display:block;color:#718397">${tip}</small>`:''}<input data-detail="${key}" type="number" min="0" step="${isCount?'1':'0.01'}" value="${esc(d[key]??'')}"></label>`}
function professionalCalc(){let f=state.forms[state.selected],d=detailForm(),v=k=>num(d[k]),gross=num(f.salary);let distance=Math.floor(v('distance')),days=Math.floor(v('workdays'));let commute=days*(Math.min(distance,20)*.30+Math.max(0,distance-20)*.38);let home=v('homeDays')*6;let wkParts={commute,home,equipment:v('equipment'),training:v('training'),travel:v('travel'),union:v('union'),other:v('otherWK')};let wkSum=Object.values(wkParts).reduce((a,b)=>a+b,0),wk=Math.max(1230,wkSum);let income=Math.max(0,gross-wk);let pension=v('pension'),baseHealth=v('health')+v('care'),unemp=v('unemployment'),otherIns=v('otherInsurance');let insurance=pension+baseHealth; // Nur sicher zuordenbare Grundbeiträge; übrige Vorsorgeaufwendungen erfordern Höchstbetragsprüfung.
let sa=insurance+v('donations')+v('churchPaid')+v('otherSA');let agb=Math.max(0,v('medical')-v('reasonable'));let zve=Math.max(0,income-sa-agb);let tax=tarif(zve,f.filing==='split'),afterCredits=Math.max(0,tax-v('taxCredit'));let balance=num(f.withheld)-afterCredits;return {gross,wkParts,wkSum,wk,income,insurance,sa,agb,zve,tax,afterCredits,balance,unemp,otherIns,wageReplacement:v('wageReplacement')};}
function taxPage(c){let m=cases.find(x=>x.id===state.selected),f=state.forms[m.id];detailForm();c.innerHTML=`<h1>Einkommensteuer 2025 · Veranlagungsarbeitsplatz</h1><p class="muted">Kanzlei Richter Tipp & Partner / ESt / VZ 2025 · Fachliche Einzelbeträge durch die Sachbearbeitung zu ermitteln</p><div class="notice"><strong>Unterrichtssimulation, keine vollständige Steuerveranlagung.</strong> Der Grund-/Splittingtarif ist implementiert; die Vorsorgeaufwendungen, der Progressionsvorbehalt und weitere Sonderfälle sind nicht vollständig automatisiert. Prüfen Sie jeden Betrag fachlich.</div><div class="panel"><h2>01 · Stammdaten</h2><div class="two"><label>Mandantenakte<select onchange="state.selected=this.value;save();render()">${cases.map(x=>`<option value="${x.id}" ${x.id===m.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><label>Veranlagungsart<select data-base="filing"><option value="single" ${f.filing==='single'?'selected':''}>Grundtarif</option><option value="split" ${f.filing==='split'?'selected':''}>Splittingtarif (nur Tarifmodell)</option></select></label></div><p class="muted">${esc(m.notes)}</p></div><div class="panel"><h2>02 · Einnahmen und Steuerabzug</h2><div class="two"><label>Bruttoarbeitslohn laut Lohnsteuerbescheinigung (€)<input data-base="salary" type="number" min="0" step="0.01" value="${esc(f.salary)}"></label><label>Einbehaltene Lohnsteuer (€)<input data-base="withheld" type="number" min="0" step="0.01" value="${esc(f.withheld)}"></label>${field('withheldSoli')}${field('wageReplacement','Progressionsvorbehalt: gesondert fachlich prüfen')}</div></div><div class="panel"><h2>03 · Werbungskosten · Anlage N</h2><p class="muted">Einzelbeträge berechnen und eintragen. Entfernungspauschale und Homeoffice-Pauschale werden aus den Mengen berechnet.</p><div class="two">${field('workdays')}${field('distance')}${field('homeDays')}${field('equipment')}${field('training')}${field('travel')}${field('union')}${field('otherWK')}</div><div class="notice">Entfernungspauschale 2025: 0,30 €/km bis zum 20. Entfernungskilometer, ab dem 21. Kilometer 0,38 €/km. Homeoffice-Tagespauschale: 6 € pro Tag, maximal 1.260 €. Zusätzliche Voraussetzungen und Höchstgrenzen (z. B. 4.500 € bei bestimmten Fahrten) sind im Einzelfall zu prüfen.</div></div><div class="panel"><h2>04 · Sonderausgaben und Vorsorgeaufwendungen</h2><div class="two">${field('pension')}${field('health')}${field('care')}${field('unemployment','Nicht automatisch berücksichtigt: Vorsorgehöchstbetrag')}${field('otherInsurance','Nicht automatisch berücksichtigt: Vorsorgehöchstbetrag')}${field('donations')}${field('churchPaid')}${field('otherSA','Nur bereits geprüfte, abzugsfähige Beträge')}</div><div class="notice">Tragen Sie bei Altersvorsorge und Basis-KV/PV bereits <strong>abziehbare Beträge</strong> ein. Für sonstige Versicherungen ist die Höchstbetragsprüfung nicht implementiert. Spendenhöchstgrenzen, Sonderausgaben-Pauschbetrag und weitere Sonderregelungen werden nicht automatisch geprüft.</div></div><div class="panel"><h2>05 · Außergewöhnliche Belastungen und Ermäßigungen</h2><div class="two">${field('medical')}${field('reasonable')}${field('taxCredit','Nur bereits fachlich ermittelte Steuerermäßigung')}</div></div><div class="panel"><h2>06 · Veranlagungsergebnis</h2><div id="professionalResult"></div><p class="no-print"><button class="primary" onclick="window.print()">Berechnung drucken / PDF</button> <button class="secondary" onclick="exportSchema()">Bearbeitung für Lehrkraft exportieren (JSON)</button> <button class="secondary" onclick="state.done[state.selected]=true;save();alert('Fall als erledigt markiert')">Fall abschließen</button></p></div><div class="panel"><h2>Bearbeitungsvermerk</h2><textarea id="notes" placeholder="Prüfung, Rechenwege, fehlende Belege, Rückfragen ...">${esc(f.notes||'')}</textarea><p><button class="secondary" onclick="state.forms[state.selected].notes=document.getElementById('notes').value;save();alert('Vermerk gespeichert')">Vermerk speichern</button></p></div>`;document.querySelectorAll('[data-detail]').forEach(el=>el.addEventListener('input',()=>{detailForm()[el.dataset.detail]=el.value;save();drawProfessionalResult()}));document.querySelectorAll('[data-base]').forEach(el=>el.addEventListener('input',()=>{state.forms[state.selected][el.dataset.base]=el.value;save();drawProfessionalResult()}));drawProfessionalResult()}
function drawProfessionalResult(){let r=professionalCalc(),f=state.forms[state.selected];let lines=[['Bruttoarbeitslohn',r.gross],['Entfernungspauschale',-r.wkParts.commute],['Homeoffice-Tagespauschale (max. 1.260 €)',-Math.min(1260,r.wkParts.home)],['Arbeitsmittel',-r.wkParts.equipment],['Fortbildung',-r.wkParts.training],['Reisekosten',-r.wkParts.travel],['Berufsverband',-r.wkParts.union],['Weitere Werbungskosten',-r.wkParts.other],['Werbungskosten insgesamt (mind. 1.230 €)',-Math.max(1230,r.wkSum-r.wkParts.home+Math.min(1260,r.wkParts.home))],['Einkünfte aus nichtselbstständiger Arbeit',r.gross-Math.max(1230,r.wkSum-r.wkParts.home+Math.min(1260,r.wkParts.home))],['Abziehbare Vorsorgeaufwendungen (eingegeben)',-r.insurance],['Weitere eingegebene Sonderausgaben',-(r.sa-r.insurance)],['Außergewöhnliche Belastungen nach Eigenbelastung',-r.agb]];let income=Math.max(0,r.gross-Math.max(1230,r.wkSum-r.wkParts.home+Math.min(1260,r.wkParts.home))),zve=Math.max(0,income-r.sa-r.agb),tax=tarif(zve,f.filing==='split'),finalTax=Math.max(0,tax-num(detailForm().taxCredit)),balance=num(f.withheld)-finalTax;lines.push(['Zu versteuerndes Einkommen (vereinfacht)',zve],['Tarifliche Einkommensteuer',tax],['Steuer nach eingegebener Ermäßigung',finalTax],['Einbehaltene Lohnsteuer',-num(f.withheld)]);document.getElementById('professionalResult').innerHTML=`<table><tbody>${lines.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${euro(v)}</td></tr>`).join('')}<tr><td><strong>${balance>=0?'Rechnerische Erstattung':'Rechnerische Nachzahlung'}</strong></td><td><strong>${euro(Math.abs(balance))}</strong></td></tr></tbody></table><p class="muted">Achtung: Die Berechnung ist nicht bescheidfähig. Insbesondere Lohnersatzleistungen/Progressionsvorbehalt (${euro(r.wageReplacement)}), sonstige Versicherungen, Solidaritätszuschlag, Kinder, Spendenhöchstgrenzen, Sonderausgaben-Pauschbetrag, Sonderfälle der Entfernungspauschale und ggf. die tatsächliche zumutbare Belastung sind gesondert zu prüfen. Keine automatische Aktualisierung der Rechtslage.</p>`}


/* ESt-Schema: alle Einzelpositionen durch Schüler selbst ermitteln */
const schemaGroups=[
 {title:'01 · Einkünfte (§ 2 Abs. 1 und 2 EStG)',fields:[
 ['land','Einkünfte aus Land- und Forstwirtschaft'],['business','Einkünfte aus Gewerbebetrieb'],['self','Einkünfte aus selbstständiger Arbeit'],
 ['wages','Bruttoarbeitslohn / Einnahmen aus nichtselbstständiger Arbeit'],['wk','Werbungskosten insgesamt (selbst berechnet)'],
 ['capital','Einkünfte aus Kapitalvermögen (soweit einzubeziehen)'],['rent','Einkünfte aus Vermietung und Verpachtung'],['otherIncome','Sonstige Einkünfte']]},
 {title:'02 · Vom Gesamtbetrag der Einkünfte zum Einkommen',fields:[
 ['ageRelief','Altersentlastungsbetrag'],['singleParent','Entlastungsbetrag für Alleinerziehende'],['agriRelief','Freibetrag nach § 13 Abs. 3 EStG'],
 ['lossCarry','Verlustabzug nach § 10d EStG (abziehbarer Betrag)'],['special','Sonderausgaben insgesamt (selbst berechnet)'],
 ['extra','Außergewöhnliche Belastungen (abziehbarer Betrag)'],['otherDeductions','Weitere gesetzlich zulässige Abzüge (geprüft)']]},
 {title:'03 · Vom Einkommen zum zu versteuernden Einkommen',fields:[
 ['childAllow','Freibeträge für Kinder (nur bei zutreffender Günstigerprüfung)'],['hardship','Härteausgleich und sonstige zulässige Abzüge']]},
 {title:'04 · Steuerfestsetzung / Anrechnung',fields:[
 ['taxReduction','Steuerermäßigungen (bereits selbst berechnet)'],['taxAdd','Hinzuzurechnende Steuerbeträge (geprüft)'],['withheldTax','Einbehaltene Lohnsteuer'],['withheldCap','Anrechenbare Kapitalertragsteuer'],['prepaid','ESt-Vorauszahlungen']]}];
const schemaKey='rtp_est_schema_2025_v2';
let schemaState;try{schemaState=JSON.parse(localStorage.getItem(schemaKey))||{}}catch{schemaState={}};
function schemaSave(){localStorage.setItem(schemaKey,JSON.stringify(schemaState))}
function schemaForm(){let id=state.selected;return schemaState[id]||(schemaState[id]={filing:'single',values:{},notes:''})}
function schemaValue(f,k){let v=f.values[k];return v===''||v===undefined?0:Math.max(0,Number(v)||0)}
function schemaRow(k,label,f){return `<label>${esc(label)} (€)<input type="number" inputmode="decimal" min="0" step="0.01" data-schema="${k}" value="${esc(f.values[k]??'')}" placeholder="Selbst ermittelten Betrag eintragen"></label>`}
function taxPage(c){const m=cases.find(x=>x.id===state.selected),f=schemaForm();c.innerHTML=`<h1>Einkommensteuer 2025 · Veranlagungsschema</h1><p class="muted">Richter Tipp und Partner · Erfassung selbst ermittelter Beträge</p><div class="notice"><strong>Arbeitsanweisung:</strong> Ermitteln Sie sämtliche Einzelbeträge zunächst eigenständig anhand der Mandantenunterlagen und der Rechtslage 2025. Erfassen Sie hier ausschließlich Ihre fertigen Ergebnisse. Leere Felder werden als 0 € behandelt. Die Software übernimmt nur das Zusammenführen der Positionen und die tarifliche Berechnung.</div><div class="panel"><h2>Mandantenakte und Tarif</h2><div class="two"><label>Mandant<select id="schemaMandant">${cases.map(x=>`<option value="${x.id}" ${x.id===m.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><label>Tarif<select id="schemaFiling"><option value="single" ${f.filing==='single'?'selected':''}>Grundtarif</option><option value="split" ${f.filing==='split'?'selected':''}>Splittingtarif (nur bei erfüllten Voraussetzungen)</option></select></label></div><p class="muted">${esc(m.notes)}</p></div>${schemaGroups.map(g=>`<div class="panel"><h2>${esc(g.title)}</h2><div class="two">${g.fields.map(([k,l])=>schemaRow(k,l,f)).join('')}</div></div>`).join('')}<div class="panel"><h2>05 · Einkommensteuer-Berechnung</h2><div id="schemaResult"></div><p class="no-print"><button class="primary" onclick="window.print()">Berechnung drucken / PDF</button> <button class="secondary" onclick="exportSchema()">Bearbeitung für Lehrkraft exportieren (JSON)</button> <button class="secondary" onclick="state.done[state.selected]=true;save();alert('Fall als erledigt markiert')">Fall abschließen</button> <button class="secondary" onclick="if(confirm('Alle Eingaben dieses Mandanten im ESt-Schema löschen?')){delete schemaState[state.selected];schemaSave();render()}">Eingaben zurücksetzen</button></p></div><div class="panel"><h2>Bearbeitungsvermerk / eigene Rechenwege</h2><textarea id="schemaNotes" placeholder="Berechnungen und verwendete Rechtsgrundlagen dokumentieren ...">${esc(f.notes)}</textarea><p><button class="secondary" id="schemaSaveNotes">Vermerk speichern</button></p></div><div class="notice">Didaktische Simulation für den VZ 2025, kein vollständiges Steuerprogramm: Nicht automatisiert werden u. a. Günstigerprüfung für Kinder, Progressionsvorbehalt, Verlustverrechnung, besondere Tarifvorschriften, Solidaritätszuschlag, Kirchensteuer und sämtliche steuerlichen Sonderfälle. Der Tarif wird nach § 32a EStG 2025 berechnet; eine amtliche Veranlagung wird nicht ersetzt.</div>`;
document.getElementById('schemaMandant').addEventListener('change',e=>{state.selected=e.target.value;save();render()});document.getElementById('schemaFiling').addEventListener('change',e=>{schemaForm().filing=e.target.value;schemaSave();drawSchema()});document.querySelectorAll('[data-schema]').forEach(el=>el.addEventListener('input',()=>{schemaForm().values[el.dataset.schema]=el.value;schemaSave();drawSchema()}));document.getElementById('schemaSaveNotes').addEventListener('click',()=>{schemaForm().notes=document.getElementById('schemaNotes').value;schemaSave();alert('Vermerk gespeichert')});drawSchema()}

function exportSchema(){
 const f=schemaForm(),m=cases.find(x=>x.id===state.selected);
 const payload={format:'RTP-EST-2025',version:1,mandant:m?.name||state.selected,caseId:state.selected,filing:f.filing,values:f.values,notes:document.getElementById('schemaNotes')?.value||f.notes||'',exportedAt:new Date().toISOString()};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='est2025_'+state.selected+'_bearbeitung.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function drawSchema(){let f=schemaForm(),v=k=>schemaValue(f,k);let nonemp=Math.max(0,v('wages')-v('wk')),sumIncome=v('land')+v('business')+v('self')+nonemp+v('capital')+v('rent')+v('otherIncome');let gdb=sumIncome-v('ageRelief')-v('singleParent')-v('agriRelief');let income=gdb-v('lossCarry')-v('special')-v('extra')-v('otherDeductions');let zve=Math.max(0,income-v('childAllow')-v('hardship'));let tax=tarif(zve,f.filing==='split'),assessed=Math.max(0,tax-v('taxReduction')+v('taxAdd'));let credited=v('withheldTax')+v('withheldCap')+v('prepaid'),diff=credited-assessed;let lines=[['Bruttoarbeitslohn',v('wages')],['– Werbungskosten (selbst ermittelt)',-v('wk')],['= Einkünfte aus nichtselbstständiger Arbeit',nonemp],['= Summe der Einkünfte',sumIncome],['– Altersentlastungsbetrag',-v('ageRelief')],['– Entlastungsbetrag für Alleinerziehende',-v('singleParent')],['– Freibetrag nach § 13 Abs. 3 EStG',-v('agriRelief')],['= Gesamtbetrag der Einkünfte',gdb],['– Verlustabzug',-v('lossCarry')],['– Sonderausgaben',-v('special')],['– außergewöhnliche Belastungen',-v('extra')],['– weitere Abzüge',-v('otherDeductions')],['= Einkommen',income],['– Freibeträge für Kinder',-v('childAllow')],['– Härteausgleich / weitere Abzüge',-v('hardship')],['= Zu versteuerndes Einkommen (vereinfachtes Schema)',zve],['= Tarifliche Einkommensteuer 2025',tax],['– Steuerermäßigungen',-v('taxReduction')],['+ Hinzuzurechnende Steuerbeträge',v('taxAdd')],['= Berechnete Einkommensteuer',assessed],['– Lohnsteuer / Kapitalertragsteuer / Vorauszahlungen',-credited]];document.getElementById('schemaResult').innerHTML=`<table><tbody>${lines.map(([label,amount])=>`<tr><td>${esc(label)}</td><td style="text-align:right;white-space:nowrap">${euro(amount)}</td></tr>`).join('')}<tr><td><strong>${diff>=0?'Rechnerische Erstattung':'Rechnerische Nachzahlung'}</strong></td><td style="text-align:right"><strong>${euro(Math.abs(diff))}</strong></td></tr></tbody></table><p class="muted">Alle Abzüge müssen vor der Eingabe eigenständig auf ihre Abziehbarkeit geprüft werden. Insbesondere wird kein Werbungskosten-Pauschbetrag automatisch angesetzt. Steuerberechnung nur im vereinfachten Modell.</p>`}

nav();render();
</script></body></html>
